# fly.toml app configuration file generated for least-count-rush-fra on 2026-08-22T21:10:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'least-count-rush-fra'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']
